[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-engine"
version = "0.1.0"
description = "Regime detection, risk allocation and live health monitoring for systematic trading systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wendenda Nathanael Kabore" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["regime_engine"]
